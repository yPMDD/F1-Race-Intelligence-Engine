[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is intentionally left blank. alembic/env.py resolves it from the
# DATABASE_URL environment variable at runtime, so migrations always target
# whichever environment invoked them (Neon in CI, local Postgres in dev).
# Never commit a connection string here.
sqlalchemy.url =

# Timestamped, descriptive migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
