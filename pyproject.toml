[project]
name = "f1-race-intelligence-engine"
version = "0.1.0"
description = "Real-time AI strategist and predictive engine for Formula 1"
readme = "README.md"
# Must stay in sync with the base image in Dockerfile (python:3.11-slim).
# 3.14 has no wheels for the xgboost/scikit-learn/numpy stack, so `uv sync`
# fails in the container if this is pinned too high.
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "chromadb>=1.5.8",
    "fastapi>=0.136.1",
    "fastf1>=3.8.3",
    "joblib>=1.5.3",
    "langchain>=1.2.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.1.10",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.3",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
